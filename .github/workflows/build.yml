name: build-windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库里的 gradle-wrapper.properties 指向腾讯镜像，境外 runner 可能拉不到；
      # 这里只在 CI 工作区临时换成官方地址，不改动仓库里的文件。
      - name: Use official Gradle distribution in CI
        shell: pwsh
        run: |
          $p = 'gradle/wrapper/gradle-wrapper.properties'
          if (Test-Path $p) {
            (Get-Content $p -Raw) -replace 'distributionUrl=.*', 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' | Set-Content $p -Encoding ascii
          }

      # jlink 的 zip-9 压缩语法是 JDK 21 引入的（JDK-8293667），JDK 17 只认 0|1|2。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # 版本不再硬编码：直接从 EngineHost.kt 读取 APP_VERSION，
      # 避免上游升到 1.0.2 后旧断言误报失败，产物名也会自动带上真实版本。
      - name: Detect toolchain and app version
        id: meta
        shell: pwsh
        run: |
          java -version
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found: $csc" }
          $hostFile = 'server\src\main\kotlin\dev\aigw\server\EngineHost.kt'
          if (-not (Test-Path $hostFile)) { throw "EngineHost.kt not found: $hostFile" }
          $m = Select-String -Path $hostFile -Pattern 'const\s+val\s+APP_VERSION\s*=\s*"([0-9][^"]*)"'
          if (-not $m) { throw 'cannot detect APP_VERSION from EngineHost.kt' }
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "detected APP_VERSION = $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      # 只生成 WebView2 版所需的精简 JRE，跳过旧桌面壳的 jpackage/MSI/EXE 链路。
      - name: Create trimmed JRE for WebView2 edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = 'java.base,java.compiler,java.desktop,java.sql,java.logging,jdk.crypto.ec,jdk.unsupported'
          $out = Join-Path $PWD 'build\release\dist\AI Gateway\runtime'
          New-Item -ItemType Directory -Path (Split-Path $out) -Force | Out-Null
          jlink --add-modules $modules --output $out --strip-debug --compress zip-9 --no-header-files --no-man-pages
          if ($LASTEXITCODE -ne 0) { throw 'jlink failed' }
          Write-Host "runtime: $out"

      # :server:installDist + 复制 web/dist + C# WebView2 外壳 + 组装 release-web。
      - name: Build WebView2 edition (build-web.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build-web.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-web.ps1 failed with exit code $LASTEXITCODE" }

      - name: Pack WebView2 edition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.meta.outputs.version }}'
          $src = Join-Path $PWD 'build\release-web'
          $zip = Join-Path $PWD "build\AI-Gateway-$ver-webview2-win-x64.zip"
          if (-not (Test-Path (Join-Path $src 'web\index.html'))) { throw 'frontend web/index.html missing' }
          if (-not (Test-Path (Join-Path $src 'AI Gateway.exe'))) { throw 'launcher AI Gateway.exe missing' }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -Force
          Write-Host "packed: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Gateway-${{ steps.meta.outputs.version }}-webview2-win-x64
          path: build\AI-Gateway-*-webview2-win-x64.zip
          if-no-files-found: error
          retention-days: 14
